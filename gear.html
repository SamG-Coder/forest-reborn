<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment lab</title></head><body>
<aside><a href="./game.html">← Game</a><h1>Equipment lab</h1><p class="muted">Male base · shared rig · layered gear</p><div id="status">Loading materials and model…</div>
<div class="buttons"><button data-preset="cloth">Traveller</button><button data-preset="mail">Mail</button><button data-preset="plate">Iron</button><button data-preset="bare">Base</button></div>
<label>Hair preview<select id="hair-preview"></select></label><label>Hair colour<input id="hair-tint" type="color" value="#362d31"></label>
<details><summary>Individual equipment slots</summary><div id="slots"></div></details><div id="variations"></div><hr><label>Animation<select id="animation"><option>idle</option><option>walk</option><option>run</option><option>guard</option><option>slash</option><option>thrust</option><option>punch</option><option>jump</option></select></label>
<label>Playback speed<input id="speed" type="range" min="0" max="1.5" step="0.05" value="1"></label><label><input type="checkbox" id="physics" checked> Simulate free cloth panels</label><label>Wind<input id="wind" type="range" min="0" max="10" value="2" step="0.2"></label><label><input type="checkbox" id="wire"> Wireframe</label>
<p id="stats"></p><div class="swatches"><img src="/assets/gear/cloth-basecolor.png" title="Cloth"><img src="/assets/gear/leather-basecolor.png" title="Leather"><img src="/assets/gear/mail-basecolor.png" title="Chainmail"><img src="/assets/gear/iron-basecolor.png" title="Iron"></div><p class="muted">Prototype patterns. Cloth uses capsule collision; this is not yet full garment self-collision.</p><a href="./crowd.html">Open 5,000-character stress test →</a></aside><main id="view"></main><script type="module" src="/src/gear/lab.js"></script></body></html>
